name: PulseBoost CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package Windows release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile-check source
        run: python -m compileall -q detection logging_module monitoring optimization dashboard.py

      - name: Run test suite
        run: python -m pytest -q

      - name: Package release
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force detection/__pycache__, logging_module/__pycache__, monitoring/__pycache__, optimization/__pycache__ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path detection, logging_module, monitoring, optimization, dashboard.py, requirements.txt, README.md -DestinationPath "dist/pulseboost-${{ github.run_number }}.zip" -Force

      - name: Publish Windows package
        uses: actions/upload-artifact@v4
        with:
          name: pulseboost-windows-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
